name: Release

on:
  push:
    tags: ["*.*-release"]

permissions:
  contents: read

concurrency:
  group: releases
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag belongs to main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Validate tag and increasing version code
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py "$RELEASE_TAG" --published >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    uses: ./.github/workflows/verify.yml

  publish:
    name: Sign APK and publish release
    needs: [prepare, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
        with:
          cache-read-only: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Generate grouped changelog
        run: npm run release:notes -- "$RELEASE_TAG" "$RELEASE_TAG" "$PREVIOUS_TAG"
      - name: Restore signing key
        env:
          FREM_KEYSTORE_BASE64: ${{ secrets.FREM_KEYSTORE_BASE64 }}
          FREM_KEYSTORE_PATH: ${{ runner.temp }}/frem-release.p12
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          key = os.environ["FREM_KEYSTORE_BASE64"]
          if not key:
              raise SystemExit("FREM_KEYSTORE_BASE64 is missing")
          path = Path(os.environ["FREM_KEYSTORE_PATH"])
          path.write_bytes(base64.b64decode(key, validate=True))
          path.chmod(0o600)
          PY
      - name: Build signed optimized APK
        env:
          FREM_KEYSTORE_PATH: ${{ runner.temp }}/frem-release.p12
          FREM_KEYSTORE_PASSWORD: ${{ secrets.FREM_KEYSTORE_PASSWORD }}
          FREM_KEY_ALIAS: ${{ secrets.FREM_KEY_ALIAS }}
          FREM_KEY_PASSWORD: ${{ secrets.FREM_KEY_PASSWORD }}
        run: ./gradlew --stacktrace :app:assembleRelease -PfremVersion="$RELEASE_VERSION"
      - name: Verify certificate, package, and version; stage assets
        run: python3 scripts/package-release.py "$RELEASE_TAG"
      - name: Preserve release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ needs.prepare.outputs.tag }}
          path: |
            build/release/
            build/release-notes.md
          if-no-files-found: error
          retention-days: 30
      - name: Publish with assets attached before making the release visible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/release-draft")" = true
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file build/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" build/release/* --clobber
          gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file build/release-notes.md --draft=false --prerelease=false --latest
      - name: Remove signing key
        if: always()
        run: rm -f -- "$RUNNER_TEMP/frem-release.p12"
